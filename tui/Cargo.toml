[package]
name = "rapoo-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for Rapoo gaming mice (VT0 Air MAX family) — ratatui frontend over the rapoo Python CLI"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

